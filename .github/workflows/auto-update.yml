name: Update Scoop Manifests

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 03:00（UTC 19:00）
    - cron: "0 19 * * *"

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: windows-latest

    steps:
      # ========================================
      # Checkout
      # ========================================

      - name: Checkout bucket
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================
      # Install Scoop
      # ========================================

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ExecutionPolicy `
              -ExecutionPolicy RemoteSigned `
              -Scope CurrentUser `
              -Force

          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
              Invoke-RestMethod `
                  -Uri "https://get.scoop.sh" |
                  Invoke-Expression
          }

          $scoop = "$env:USERPROFILE\scoop"
          $scoopPs1 = "$scoop\shims\scoop.ps1"

          if (-not (Test-Path $scoopPs1)) {
              throw "Scoop installation failed: $scoopPs1"
          }

          "$scoop\shims" |
              Out-File `
                  -FilePath $env:GITHUB_PATH `
                  -Encoding utf8 `
                  -Append

          $env:PATH = "$scoop\shims;$env:PATH"

          Write-Host "Scoop:"
          & $scoopPs1 --version

      # ========================================
      # Update Scoop itself
      # ========================================

      - name: Update Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $scoop = "$env:USERPROFILE\scoop"
          $scoopPs1 = "$scoop\shims\scoop.ps1"

          & $scoopPs1 update

      # ========================================
      # Detect and update manifests
      # ========================================

      - name: Detect and update manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bucketDir = "$env:GITHUB_WORKSPACE\bucket"
          $scoop = "$env:USERPROFILE\scoop"
          $checkver = "$scoop\apps\scoop\current\bin\checkver.ps1"

          if (-not (Test-Path $bucketDir)) {
              throw "Bucket directory not found: $bucketDir"
          }

          if (-not (Test-Path $checkver)) {
              throw "checkver.ps1 not found: $checkver"
          }

          # ========================================
          # Skip list
          #
          # Manifests that must NOT be auto-updated.
          #
          # Reasons for skipping:
          #   - tag and file name use different version
          #     strings (e.g. bilibili-linux: tag v1.19.0-1
          #     but file bilibili-1.19.0-x64.exe)
          #   - pre-release / suffixed versions
          #   - manual edits required
          #
          # Add more entries as needed. Matching is by
          # manifest base name (file name without .json).
          # ========================================

          $skipList = @(
              "bilibili-linux"
          )

          Write-Host "========================================"
          Write-Host "Scoop bucket: $bucketDir"
          Write-Host "Skip list   : $($skipList -join ', ')"
          Write-Host "========================================"

          $manifests = @(
              Get-ChildItem `
                  -Path $bucketDir `
                  -Filter "*.json" `
                  -File |
                  Sort-Object Name
          )

          if ($manifests.Count -eq 0) {
              Write-Host "No manifests found."
              exit 0
          }

          $failed = @()
          $updated = @()
          $unchanged = @()
          $skipped = @()

          # ========================================
          # Get JSON property safely
          # ========================================

          function Get-PropertyValue {
              param(
                  [Parameter(Mandatory = $true)]
                  $Object,

                  [Parameter(Mandatory = $true)]
                  [string]$Name
              )

              if ($null -eq $Object) {
                  return $null
              }

              $property = $Object.PSObject.Properties[$Name]

              if ($null -eq $property) {
                  return $null
              }

              return $property.Value
          }

          # ========================================
          # Replace $version
          # ========================================

          function Expand-AutoUpdateUrl {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Template,

                  [Parameter(Mandatory = $true)]
                  [string]$Version
              )

              return $Template.Replace('$version', $Version)
          }

          # ========================================
          # Parse checkver output (generic)
          #
          # - accepts empty string safely
          # - strips ANSI escape codes
          # - folds line breaks into spaces
          #   (Out-String may wrap the output
          #    into multiple lines based on width)
          # - then applies a single-line regex
          # ========================================

          function Parse-CheckverOutput {
              param(
                  [AllowEmptyString()]
                  [string]$Output
              )

              $result = @{
                  Latest  = $null
                  Current = $null
              }

              if ([string]::IsNullOrEmpty($Output)) {
                  return $result
              }

              # 1. Strip ANSI escape codes.
              $clean =
                  $Output -replace "\x1B\[[0-9;]*[A-Za-z]", ""

              # 2. Fold all line breaks into spaces.
              $clean =
                  $clean -replace "`r`n", " " `
                         -replace "`r", " " `
                         -replace "`n", " "

              # 3. Collapse runs of whitespace into single spaces.
              $clean = $clean -replace "\s+", " "

              # 4. Primary form:
              #    <app>: <latest> (scoop version is <current>)
              $m = [regex]::Match(
                  $clean,
                  '(?<app>[^\s:]+):\s*(?<latest>\S+)\s*\(scoop version is\s*(?<current>[^)]+?)\s*\)'
              )

              if ($m.Success) {
                  $result.Latest  = $m.Groups['latest'].Value.Trim()
                  $result.Current = $m.Groups['current'].Value.Trim()
                  return $result
              }

              # 5. Fallback form: <app>: <latest>
              $m2 = [regex]::Match(
                  $clean,
                  '(?<app>[^\s:]+):\s*(?<latest>[vV]?\d[\w.\-]*)\b'
              )

              if ($m2.Success) {
                  $result.Latest = $m2.Groups['latest'].Value.Trim()
              }

              return $result
          }

          # ========================================
          # Update URL and extract_dir only
          #
          # IMPORTANT:
          # hash is NEVER touched.
          #
          # extract_dir must be kept in sync with
          # $version whenever the autoupdate template
          # contains it (e.g. hydra):
          #   hydra-<version>-windows-amd64
          # ========================================

          function Update-ManifestUrl {
              param(
                  [Parameter(Mandatory = $true)]
                  $Manifest,

                  [Parameter(Mandatory = $true)]
                  [string]$Version
              )

              $auto =
                  Get-PropertyValue `
                      -Object $Manifest `
                      -Name "autoupdate"

              if ($null -eq $auto) {
                  Write-Host "  [debug] autoupdate = null"
                  return $false
              }

              Write-Host "  [debug] autoupdate keys : $($auto.PSObject.Properties.Name -join ', ')"

              $autoUrlType =
                  if ($null -ne $auto.url) {
                      $auto.url.GetType().FullName
                  } else {
                      "<null>"
                  }

              Write-Host "  [debug] autoupdate.url  : type=$autoUrlType value=$($auto.url)"
              Write-Host "  [debug] manifest keys   : $($Manifest.PSObject.Properties.Name -join ', ')"
              Write-Host "  [debug] manifest.url    : $($Manifest.url)"

              $changed = $false

              # ----------------------------------------
              # Simple manifest
              # ----------------------------------------

              $autoUrl =
                  Get-PropertyValue `
                      -Object $auto `
                      -Name "url"

              if ($autoUrl -is [string]) {

                  $newUrl =
                      Expand-AutoUpdateUrl `
                          -Template $autoUrl `
                          -Version $Version

                  $oldUrl =
                      Get-PropertyValue `
                          -Object $Manifest `
                          -Name "url"

                  if ($oldUrl -ne $newUrl) {
                      $Manifest.url = $newUrl
                      $changed = $true
                  }

                  # Simple manifest: extract_dir (top level)
                  $autoExtractDir =
                      Get-PropertyValue `
                          -Object $auto `
                          -Name "extract_dir"

                  if ($autoExtractDir -is [string]) {

                      $newExtractDir =
                          Expand-AutoUpdateUrl `
                              -Template $autoExtractDir `
                              -Version $Version

                      $oldExtractDir =
                          Get-PropertyValue `
                              -Object $Manifest `
                              -Name "extract_dir"

                      if ($oldExtractDir -ne $newExtractDir) {
                          $Manifest.extract_dir = $newExtractDir
                          $changed = $true
                      }
                  }

                  return $changed
              }

              # ----------------------------------------
              # Architecture manifest
              # ----------------------------------------

              $autoArchitecture =
                  Get-PropertyValue `
                      -Object $auto `
                      -Name "architecture"

              if ($null -eq $autoArchitecture) {
                  Write-Host "  [debug] autoupdate.architecture = null"
                  return $false
              }

              $manifestArchitecture =
                  Get-PropertyValue `
                      -Object $Manifest `
                      -Name "architecture"

              if ($null -eq $manifestArchitecture) {
                  Write-Host "  [debug] manifest.architecture = null"
                  return $false
              }

              foreach ($archProperty in $autoArchitecture.PSObject.Properties) {

                  $archName = $archProperty.Name
                  $archAuto = $archProperty.Value

                  $archAutoUrl =
                      Get-PropertyValue `
                          -Object $archAuto `
                          -Name "url"

                  if ($archAutoUrl -isnot [string]) {
                      Write-Host "  [debug] auto.arch.$archName.url is not a string, skipping"
                      continue
                  }

                  $archManifest =
                      Get-PropertyValue `
                          -Object $manifestArchitecture `
                          -Name $archName

                  if ($null -eq $archManifest) {
                      Write-Host "  [debug] manifest.arch.$archName missing, skipping"
                      continue
                  }

                  $newUrl =
                      Expand-AutoUpdateUrl `
                          -Template $archAutoUrl `
                          -Version $Version

                  $oldUrl =
                      Get-PropertyValue `
                          -Object $archManifest `
                          -Name "url"

                  if ($oldUrl -ne $newUrl) {
                      $archManifest.url = $newUrl
                      $changed = $true
                  }

                  # Architecture manifest: extract_dir (per arch)
                  $archAutoExtractDir =
                      Get-PropertyValue `
                          -Object $archAuto `
                          -Name "extract_dir"

                  if ($archAutoExtractDir -is [string]) {

                      $newExtractDir =
                          Expand-AutoUpdateUrl `
                              -Template $archAutoExtractDir `
                              -Version $Version

                      $oldExtractDir =
                          Get-PropertyValue `
                              -Object $archManifest `
                              -Name "extract_dir"

                      if ($oldExtractDir -ne $newExtractDir) {
                          $archManifest.extract_dir = $newExtractDir
                          $changed = $true
                      }
                  }
              }

              return $changed
          }

          # ========================================
          # Process every manifest
          # ========================================

          foreach ($file in $manifests) {

              $name = $file.BaseName

              Write-Host ""
              Write-Host "----------------------------------------"
              Write-Host "Checking: $name"
              Write-Host "----------------------------------------"

              # ----------------------------------------
              # Skip list check
              # ----------------------------------------

              if ($skipList -contains $name) {
                  Write-Host "SKIPPED: $name (in skip list)"

                  $skipped += $name

                  continue
              }

              try {

                  # ----------------------------------------
                  # 1. Read manifest
                  # ----------------------------------------

                  $jsonText =
                      Get-Content `
                          -LiteralPath $file.FullName `
                          -Raw `
                          -Encoding UTF8

                  $manifest =
                      $jsonText | ConvertFrom-Json

                  $currentVersion =
                      [string]$manifest.version

                  if ([string]::IsNullOrWhiteSpace($currentVersion)) {
                      throw "Manifest does not contain a valid version."
                  }

                  # ----------------------------------------
                  # 2. checkver
                  #
                  # Capture host / information stream too:
                  #   PowerShell 7 routes Write-Host through
                  #   the information stream (stream 6).
                  #
                  # ONLY detect. NEVER use -Update.
                  # ----------------------------------------

                  $output =
                      & $checkver `
                          -App $name `
                          -Dir $bucketDir 6>&1 2>&1 |
                          Out-String

                  Write-Host "  [debug] checkver output length = $($output.Length)"
                  Write-Host $output

                  # ----------------------------------------
                  # 3. Parse checkver result
                  # ----------------------------------------

                  $parsed =
                      Parse-CheckverOutput -Output $output

                  $latestVersion = $parsed.Latest

                  if (-not [string]::IsNullOrWhiteSpace($latestVersion)) {
                      Write-Host ""
                      Write-Host "Detected update:"
                      Write-Host "  Manifest : $name"
                      Write-Host "  Current  : $($parsed.Current)"
                      Write-Host "  Latest   : $latestVersion"
                  }

                  # ----------------------------------------
                  # No update
                  # ----------------------------------------

                  if ([string]::IsNullOrWhiteSpace($latestVersion)) {

                      Write-Host "No update available."

                      $unchanged += $name

                      continue
                  }

                  Write-Host ""
                  Write-Host "Current version : $currentVersion"
                  Write-Host "Latest version  : $latestVersion"

                  # ----------------------------------------
                  # 4. Extra protection
                  # ----------------------------------------

                  if ($latestVersion -eq $currentVersion) {

                      Write-Host "Already up to date."

                      $unchanged += $name

                      continue
                  }

                  # ----------------------------------------
                  # 5. autoupdate must exist
                  # ----------------------------------------

                  if ($null -eq $manifest.autoupdate) {
                      throw "New version detected but autoupdate is missing."
                  }

                  # ----------------------------------------
                  # 6. Update version
                  # ----------------------------------------

                  $manifest.version = $latestVersion

                  # ----------------------------------------
                  # 7. Update URL / extract_dir
                  #
                  # ONLY version + URL + extract_dir are changed.
                  # hash is NOT read, NOT calculated, NOT modified.
                  # ----------------------------------------

                  $urlChanged =
                      Update-ManifestUrl `
                          -Manifest $manifest `
                          -Version $latestVersion

                  if (-not $urlChanged) {
                      throw `
                          "New version detected but no autoupdate URL could be generated."
                  }

                  # ----------------------------------------
                  # 8. Write JSON
                  # ----------------------------------------

                  $newJson =
                      $manifest |
                      ConvertTo-Json -Depth 100

                  [System.IO.File]::WriteAllText(
                      $file.FullName,
                      $newJson + [Environment]::NewLine,
                      [System.Text.UTF8Encoding]::new($false)
                  )

                  Write-Host ""
                  Write-Host "UPDATED: $name"
                  Write-Host "  Version     : $currentVersion -> $latestVersion"
                  Write-Host "  URL         : updated"
                  Write-Host "  extract_dir : updated (if present)"
                  Write-Host "  Hash        : untouched"

                  $updated += $name
              }
              catch {

                  Write-Host ""
                  Write-Host "FAILED: $name" -ForegroundColor Red
                  Write-Host "  Reason : $($_.Exception.Message)" -ForegroundColor Red
                  Write-Host "  Type   : $($_.Exception.GetType().FullName)" -ForegroundColor DarkRed
                  Write-Host "  Trace  : $($_.ScriptStackTrace)" -ForegroundColor DarkGray

                  $failed += $name
              }
          }

          # ========================================
          # JSON validation
          # ========================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Validating JSON"
          Write-Host "========================================"

          $jsonFailed = @()

          foreach ($file in $manifests) {

              try {

                  Get-Content `
                      -LiteralPath $file.FullName `
                      -Raw `
                      -Encoding UTF8 |
                      ConvertFrom-Json |
                      Out-Null

                  Write-Host "OK: $($file.Name)"
              }
              catch {

                  Write-Host "INVALID JSON: $($file.Name)" -ForegroundColor Red
                  Write-Host "  Reason : $($_.Exception.Message)" -ForegroundColor Red
                  Write-Host "  Trace  : $($_.ScriptStackTrace)" -ForegroundColor DarkGray

                  $jsonFailed += $file.BaseName
              }
          }

          # ========================================
          # Summary
          # ========================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Update Summary"
          Write-Host "========================================"

          Write-Host "Updated   : $($updated.Count)"
          Write-Host "Unchanged : $($unchanged.Count)"
          Write-Host "Skipped   : $($skipped.Count)"
          Write-Host "Failed    : $($failed.Count)"
          Write-Host "JSON fail : $($jsonFailed.Count)"

          if ($updated.Count -gt 0) {

              Write-Host ""
              Write-Host "Updated manifests:"

              $updated |
                  ForEach-Object {
                      Write-Host "  - $_"
                  }
          }

          if ($skipped.Count -gt 0) {

              Write-Host ""
              Write-Host "Skipped manifests:"

              $skipped |
                  ForEach-Object {
                      Write-Host "  - $_"
                  }
          }

          if ($failed.Count -gt 0) {

              Write-Host ""
              Write-Host "Failed manifests:"

              $failed |
                  ForEach-Object {
                      Write-Host "  - $_"
                  }
          }

          if ($jsonFailed.Count -gt 0) {

              Write-Host ""
              Write-Host "Invalid JSON manifests:"

              $jsonFailed |
                  ForEach-Object {
                      Write-Host "  - $_"
                  }
          }

          # ========================================
          # Record failure flag for later steps
          # ========================================

          $hasFailure =
              ($failed.Count -gt 0) -or ($jsonFailed.Count -gt 0)

          "HAS_FAILURE=$($hasFailure.ToString().ToLower())" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ========================================
      # Show git changes
      # ========================================

      - name: Show changes
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "Git changes"
          Write-Host "========================================"

          git status --short

          Write-Host ""
          git diff -- bucket

      # ========================================
      # Commit and push
      # ========================================

      - name: Commit and push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $changes =
              git status --porcelain

          if ([string]::IsNullOrWhiteSpace($changes)) {

              Write-Host "No manifest changes."
              Write-Host "Nothing to commit."

              exit 0
          }

          git add bucket

          git commit `
              -m "chore: update Scoop manifests"

          git push

      # ========================================
      # Fail workflow if any manifest failed
      # ========================================

      - name: Fail if any manifest failed
        if: env.HAS_FAILURE == 'true'
        shell: pwsh
        run: |
          Write-Error "One or more manifests failed to update or validate."
          exit 1
