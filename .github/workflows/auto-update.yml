name: Auto Update Scoop Manifests

on:
  schedule:
    # 每天北京时间 03:00（UTC 19:00）
    - cron: "0 19 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Check and update manifests
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Install Scoop
      # --------------------------------------------------
      - name: Install Scoop
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

          $env:SCOOP = "$env:USERPROFILE\scoop"

          if (-not (Test-Path "$env:SCOOP\shims\scoop.ps1")) {
              Write-Host "Installing Scoop..."

              Invoke-RestMethod `
                  -Uri 'https://get.scoop.sh' `
                  -OutFile "$env:TEMP\install-scoop.ps1"

              & "$env:TEMP\install-scoop.ps1" -RunAsAdmin:$false
          }

          $scoopRoot = "$env:USERPROFILE\scoop"
          $scoop = "$scoopRoot\shims\scoop.ps1"

          if (-not (Test-Path $scoop)) {
              throw "Scoop installation failed: $scoop"
          }

          # 当前 PowerShell 会话立即加入 Scoop
          $env:PATH = "$scoopRoot\shims;$env:PATH"

          Write-Host "Scoop root: $scoopRoot"
          Write-Host "Scoop executable: $scoop"

          & $scoop --version

      # --------------------------------------------------
      # 3. Update Scoop itself
      # --------------------------------------------------
      - name: Update Scoop
        run: |
          $env:SCOOP = "$env:USERPROFILE\scoop"
          $env:PATH = "$env:SCOOP\shims;$env:PATH"

          $scoop = "$env:SCOOP\shims\scoop.ps1"

          if (-not (Test-Path $scoop)) {
              throw "Scoop not found: $scoop"
          }

          & $scoop update

      # --------------------------------------------------
      # 4. Check all manifests
      # --------------------------------------------------
      - name: Check all manifests
        run: |
          $env:SCOOP = "$env:USERPROFILE\scoop"
          $env:PATH = "$env:SCOOP\shims;$env:PATH"

          $checkver = "$env:SCOOP\apps\scoop\current\bin\checkver.ps1"

          if (-not (Test-Path $checkver)) {
              throw "checkver.ps1 not found: $checkver"
          }

          Write-Host "Using:"
          Write-Host $checkver

          & $checkver `
              -App * `
              -Dir "$env:GITHUB_WORKSPACE\bucket"

      # --------------------------------------------------
      # 5. Automatically update manifests
      # --------------------------------------------------
      - name: Auto update manifests
        run: |
          $env:SCOOP = "$env:USERPROFILE\scoop"
          $env:PATH = "$env:SCOOP\shims;$env:PATH"

          $checkver = "$env:SCOOP\apps\scoop\current\bin\checkver.ps1"

          if (-not (Test-Path $checkver)) {
              throw "checkver.ps1 not found: $checkver"
          }

          & $checkver `
              -App * `
              -Dir "$env:GITHUB_WORKSPACE\bucket" `
              -Update

      # --------------------------------------------------
      # 6. Show changes
      # --------------------------------------------------
      - name: Show changes
        run: |
          Write-Host "Git status:"
          git status --short

          Write-Host ""
          Write-Host "Git diff:"
          git diff -- bucket

      # --------------------------------------------------
      # 7. Validate JSON
      # --------------------------------------------------
      - name: Validate JSON manifests
        run: |
          $errors = @()

          Get-ChildItem "$env:GITHUB_WORKSPACE\bucket\*.json" |
              ForEach-Object {
                  try {
                      Get-Content $_.FullName -Raw |
                          ConvertFrom-Json |
                          Out-Null

                      Write-Host "OK: $($_.Name)"
                  }
                  catch {
                      Write-Error "Invalid JSON: $($_.FullName)"
                      Write-Error $_
                      $errors += $_.Name
                  }
              }

          if ($errors.Count -gt 0) {
              throw "Invalid manifest(s): $($errors -join ', ')"
          }

      # --------------------------------------------------
      # 8. Commit and push
      # --------------------------------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bucket/*.json

          if (git diff --cached --quiet) {
              Write-Host "No manifest updates."
              exit 0
          }

          $date = Get-Date -Format "yyyy-MM-dd"

          git commit -m "Update manifests ($date)"
          git push
