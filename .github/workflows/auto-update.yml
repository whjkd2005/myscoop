name: Update Scoop Manifests

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 03:00
    - cron: "0 19 * * *"

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
              Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          }

          $scoop = "$env:USERPROFILE\scoop"

          if (-not (Test-Path "$scoop\shims\scoop.ps1")) {
              throw "Scoop installation failed."
          }

          $env:PATH = "$scoop\shims;$env:PATH"

          & "$scoop\shims\scoop.ps1" --version

      - name: Update Scoop
        shell: pwsh
        run: |
          $scoop = "$env:USERPROFILE\scoop"
          $scoopPs1 = "$scoop\shims\scoop.ps1"

          & $scoopPs1 update

      - name: Detect and update manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bucketDir = "$env:GITHUB_WORKSPACE\bucket"
          $scoop = "$env:USERPROFILE\scoop"
          $checkver = "$scoop\apps\scoop\current\bin\checkver.ps1"

          if (-not (Test-Path $bucketDir)) {
              throw "Bucket directory not found: $bucketDir"
          }

          if (-not (Test-Path $checkver)) {
              throw "checkver.ps1 not found: $checkver"
          }

          Write-Host "========================================"
          Write-Host "Scoop bucket: $bucketDir"
          Write-Host "========================================"

          $manifests = Get-ChildItem `
              -Path $bucketDir `
              -Filter "*.json" `
              -File |
              Sort-Object Name

          if ($manifests.Count -eq 0) {
              Write-Host "No manifests found."
              exit 0
          }

          $failed = @()
          $updated = @()
          $unchanged = @()

          function Get-PropertyValue {
              param(
                  [Parameter(Mandatory)]
                  $Object,

                  [Parameter(Mandatory)]
                  [string]$Name
              )

              if ($null -eq $Object) {
                  return $null
              }

              $property = $Object.PSObject.Properties[$Name]

              if ($null -eq $property) {
                  return $null
              }

              return $property.Value
          }

          function Expand-AutoUpdateUrl {
              param(
                  [Parameter(Mandatory)]
                  [string]$Template,

                  [Parameter(Mandatory)]
                  [string]$Version
              )

              # 当前 bucket 主要使用 $version。
              # 保留 URL fragment，例如 #/dl.7z。
              $result = $Template

              $result = $result.Replace('$version', $Version)

              return $result
          }

          function Update-ManifestUrl {
              param(
                  [Parameter(Mandatory)]
                  $Manifest,

                  [Parameter(Mandatory)]
                  [string]$Version
              )

              $auto = Get-PropertyValue $Manifest "autoupdate"

              if ($null -eq $auto) {
                  return $false
              }

              $changed = $false

              # ----------------------------------------
              # 普通 manifest:
              #
              # "url": "...",
              # "autoupdate": {
              #     "url": "..."
              # }
              # ----------------------------------------

              $autoUrl = Get-PropertyValue $auto "url"

              if ($autoUrl -is [string]) {
                  $newUrl = Expand-AutoUpdateUrl `
                      -Template $autoUrl `
                      -Version $Version

                  if ($newUrl -ne $Manifest.url) {
                      $Manifest.url = $newUrl
                      $changed = $true
                  }

                  return $changed
              }

              # ----------------------------------------
              # architecture:
              #
              # "architecture": {
              #   "64bit": {
              #     "url": "..."
              #   }
              # },
              #
              # "autoupdate": {
              #   "architecture": {
              #     "64bit": {
              #       "url": "..."
              #     }
              #   }
              # }
              # ----------------------------------------

              $autoArchitecture = Get-PropertyValue $auto "architecture"

              if ($null -eq $autoArchitecture) {
                  return $changed
              }

              $manifestArchitecture =
                  Get-PropertyValue $Manifest "architecture"

              if ($null -eq $manifestArchitecture) {
                  return $changed
              }

              foreach ($archProperty in $autoArchitecture.PSObject.Properties) {
                  $archName = $archProperty.Name
                  $archAuto = $archProperty.Value

                  $archAutoUrl =
                      Get-PropertyValue $archAuto "url"

                  if ($archAutoUrl -isnot [string]) {
                      continue
                  }

                  $archManifest =
                      Get-PropertyValue $manifestArchitecture $archName

                  if ($null -eq $archManifest) {
                      continue
                  }

                  $newUrl = Expand-AutoUpdateUrl `
                      -Template $archAutoUrl `
                      -Version $Version

                  $oldUrl =
                      Get-PropertyValue $archManifest "url"

                  if ($oldUrl -ne $newUrl) {
                      $archManifest.url = $newUrl
                      $changed = $true
                  }
              }

              return $changed
          }

          foreach ($file in $manifests) {

              $name = $file.BaseName

              Write-Host ""
              Write-Host "----------------------------------------"
              Write-Host "Checking: $name"
              Write-Host "----------------------------------------"

              try {
                  # ----------------------------------------
                  # 1. 读取原始 JSON
                  # ----------------------------------------

                  $jsonText = Get-Content `
                      -LiteralPath $file.FullName `
                      -Raw `
                      -Encoding UTF8

                  $manifest =
                      $jsonText | ConvertFrom-Json

                  $currentVersion =
                      [string]$manifest.version

                  if ([string]::IsNullOrWhiteSpace($currentVersion)) {
                      throw "Manifest does not contain a valid version."
                  }

                  # ----------------------------------------
                  # 2. checkver 只检测版本
                  #
                  #    绝不使用 -Update
                  # ----------------------------------------

                  $output = & $checkver `
                      -App $file.FullName `
                      -Dir $bucketDir 2>&1 |
                      Out-String

                  Write-Host $output

                  # ----------------------------------------
                  # 3. 从 checkver 输出取得最新版本
                  #
                  # 典型输出：
                  #
                  # app: 1.2.3
                  # 或
                  # app: 1.2.3 (scoop version is 1.2.2)
                  # ----------------------------------------

                  $latestVersion = $null

                  $patterns = @(
                      "(?m)^\s*$([regex]::Escape($name)):\s*([0-9][0-9A-Za-z._+-]*)\s+\(scoop version",
                      "(?m)^\s*$([regex]::Escape($name)):\s*([0-9][0-9A-Za-z._+-]*)\s*$"
                  )

                  foreach ($pattern in $patterns) {
                      $match = [regex]::Match($output, $pattern)

                      if ($match.Success) {
                          $latestVersion = $match.Groups[1].Value
                          break
                      }
                  }

                  if ([string]::IsNullOrWhiteSpace($latestVersion)) {
                      Write-Host "Could not determine a newer version."
                      $unchanged += $name
                      continue
                  }

                  Write-Host "Current version : $currentVersion"
                  Write-Host "Latest version  : $latestVersion"

                  # ----------------------------------------
                  # 4. 没有新版本
                  # ----------------------------------------

                  if ($latestVersion -eq $currentVersion) {
                      Write-Host "Already up to date."
                      $unchanged += $name
                      continue
                  }

                  # ----------------------------------------
                  # 5. 检查 autoupdate
                  # ----------------------------------------

                  if ($null -eq $manifest.autoupdate) {
                      throw "New version detected but autoupdate is missing."
                  }

                  # ----------------------------------------
                  # 6. 修改 version
                  # ----------------------------------------

                  $manifest.version = $latestVersion

                  # ----------------------------------------
                  # 7. 只更新 URL
                  #
                  #    注意：
                  #    不读取、不生成、不修改 hash
                  # ----------------------------------------

                  $urlChanged =
                      Update-ManifestUrl `
                          -Manifest $manifest `
                          -Version $latestVersion

                  if (-not $urlChanged) {
                      throw "New version detected but no autoupdate URL could be generated."
                  }

                  # ----------------------------------------
                  # 8. 写回 JSON
                  # ----------------------------------------

                  $newJson =
                      $manifest |
                      ConvertTo-Json -Depth 100

                  # 确保 UTF-8 无 BOM
                  [System.IO.File]::WriteAllText(
                      $file.FullName,
                      $newJson + [Environment]::NewLine,
                      [System.Text.UTF8Encoding]::new($false)
                  )

                  Write-Host ""
                  Write-Host "UPDATED: $name"
                  Write-Host "  $currentVersion -> $latestVersion"
                  Write-Host "  URL updated"
                  Write-Host "  HASH untouched"

                  $updated += $name
              }
              catch {
                  Write-Error "FAILED: $name"
                  Write-Error $_.Exception.Message

                  $failed += $name
              }
          }

          # ========================================
          # JSON validation
          # ========================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Validating JSON"
          Write-Host "========================================"

          $jsonFailed = @()

          foreach ($file in $manifests) {
              try {
                  Get-Content `
                      -LiteralPath $file.FullName `
                      -Raw `
                      -Encoding UTF8 |
                      ConvertFrom-Json |
                      Out-Null

                  Write-Host "OK: $($file.Name)"
              }
              catch {
                  Write-Error "INVALID JSON: $($file.Name)"
                  Write-Error $_.Exception.Message

                  $jsonFailed += $file.BaseName
              }
          }

          # ========================================
          # Summary
          # ========================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Update Summary"
          Write-Host "========================================"

          Write-Host "Updated   : $($updated.Count)"
          Write-Host "Unchanged : $($unchanged.Count)"
          Write-Host "Failed    : $($failed.Count)"
          Write-Host "JSON fail : $($jsonFailed.Count)"

          if ($updated.Count -gt 0) {
              Write-Host ""
              Write-Host "Updated manifests:"
              $updated | ForEach-Object {
                  Write-Host "  - $_"
              }
          }

          if ($failed.Count -gt 0) {
              Write-Host ""
              Write-Host "Failed manifests:"
              $failed | ForEach-Object {
                  Write-Host "  - $_"
              }
          }

          if ($jsonFailed.Count -gt 0) {
              Write-Host ""
              Write-Host "Invalid JSON manifests:"
              $jsonFailed | ForEach-Object {
                  Write-Host "  - $_"
              }
          }

          # ========================================
          # 最终失败判断
          # ========================================

          if ($failed.Count -gt 0 -or $jsonFailed.Count -gt 0) {
              throw "Manifest update or JSON validation failed."
          }

      - name: Show changes
        shell: pwsh
        run: |
          git status --short
          git diff -- bucket

      - name: Commit and push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $changes = git status --porcelain

          if ([string]::IsNullOrWhiteSpace($changes)) {
              Write-Host "No manifest changes. Nothing to commit."
              exit 0
          }

          git add bucket/*.json

          git commit `
            -m "chore: update Scoop manifests"

          git push
